[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "food-intelligence-engine"
version = "0.1.0"
description = "Standalone, offline-first food intelligence engine for packaged food label OCR, nutrition extraction, product matching, and allergen evaluation."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
    "pyyaml>=6.0.2",
    "pydantic>=2.10.0",
    "requests>=2.32.0",
    "pillow>=11.0.0",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "jsonschema>=4.23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
]
ocr = [
    "paddlepaddle>=3.0.0",
    "paddleocr>=2.9.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
